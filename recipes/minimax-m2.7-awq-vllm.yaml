# Recipe: minimax-m2.7-awq-vllm
# MiniMax M2.7 (AWQ 4-bit) on vLLM, Ray-Distributed, 2-node cluster

recipe_version: '2'
name: minimax-m2.7-awq-vllm
description: vLLM serving MiniMax-M2.7-AWQ on a two-node DGX Spark cluster

# HuggingFace model to download (optional, for --download-model)
model: cyankiwi/MiniMax-M2.7-AWQ-4bit

runtime: vllm

# Container image to use
container: vllm-node

# Cluster only: 2+ Nodes (TP2)
min_nodes: 2

# No mods required
mods: []

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 128000

# Environment variables
env: {}

# The vLLM serve command template
command: |
  vllm serve {model} \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --distributed-executor-backend ray \
      --max-model-len {max_model_len} \
      --load-format instanttensor \
      --enable-auto-tool-choice \
      --tool-call-parser minimax_m2 \
      --reasoning-parser minimax_m2
