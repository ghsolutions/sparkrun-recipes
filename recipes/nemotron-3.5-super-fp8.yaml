# Recipe: Nemotron 3.5 Super VL 120B-A12B FP8 (RedHatAI), 2x DGX Spark, TP=2
recipe_version: "2"
name: NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-FP8
description: vLLM serving Nemotron 3.5 Super VL FP8 on two DGX Sparks (TP=2) with MTP speculative decoding
model: RedHatAI/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-FP8
maintainer: gh-solutions 2026
container: vllm/vllm-openai:v0.31.0
#container: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.3.7-1789582776
cluster_only: true

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.78
  max_model_len: 1048576 #114688
  max_num_seqs: 128
  max_num_batched_tokens: 8192
  num_speculative_tokens: 8

command: |
  vllm serve {model} \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --prefix-match-unit 64 \
      --block-size 64 \
      --limit-mm-per-prompt '{"video":0}' \
      --compilation_config.max_cudagraph_capture_size 192 \
      --enable-expert-parallel \
      --max-num-seqs {max_num_seqs} \
      --trust-remote-code \
      --max-model-len {max_model_len} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --enable-prefix-caching \
      --async-scheduling \
      --speculative_config.method mtp \
      --speculative_config.num_speculative_tokens {num_speculative_tokens} \
      --mamba-backend flashinfer \
      --mamba-ssm-cache-dtype float16 \
      --enable-mamba-cache-stochastic-rounding \
      --mamba-cache-philox-rounds 5 \
      --chat-template-content-format string \
      --mamba-cache-mode align \
      --enable-auto-tool-choice \
      --tool-call-parser qwen3_coder \
      --reasoning-parser nemotron_v3
      
